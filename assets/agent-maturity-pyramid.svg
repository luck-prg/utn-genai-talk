<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1020" viewBox="0 0 1400 1020" role="img" aria-labelledby="title desc">
  <title id="title">Pirámide de madurez para desarrollar con agentes</title>
  <desc id="desc">Pirámide de ocho niveles, desde chat-driven coding hasta orquestación de agentes. Los primeros niveles enfatizan madurez del contexto y los superiores madurez de la ejecución.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#94a3b8"/>
    </marker>
    <style>
      .title{font:700 38px Inter,Arial,sans-serif;fill:#f8fafc}.subtitle{font:400 20px Inter,Arial,sans-serif;fill:#cbd5e1}.lvl{font:800 24px Inter,Arial,sans-serif;fill:#fff}.txt{font:600 21px Inter,Arial,sans-serif;fill:#f8fafc}.small{font:500 16px Inter,Arial,sans-serif;fill:#e2e8f0}.side{font:800 24px Inter,Arial,sans-serif;letter-spacing:.5px}.note{font:600 18px Inter,Arial,sans-serif;fill:#cbd5e1}.arrow{stroke:#94a3b8;stroke-width:3;fill:none;marker-end:url(#arrow)}.scope{font:700 17px Inter,Arial,sans-serif;fill:#fef3c7}
    </style>
  </defs>
  <rect width="1400" height="1020" fill="url(#bg)"/>
  <path d="M0 130 H1400 M0 250 H1400 M0 370 H1400 M0 490 H1400 M0 610 H1400 M0 730 H1400 M0 850 H1400" stroke="#1e293b" stroke-width="1" opacity="0.45"/>
  <text x="700" y="70" text-anchor="middle" class="title">Niveles de profesionalismo para desarrollar con agentes</text>
  <text x="700" y="105" text-anchor="middle" class="subtitle">La charla trabaja hasta nivel 3/4; los niveles 5-7 quedan como horizonte avanzado</text>

  <g filter="url(#shadow)">
    <polygon points="700,150 591,240 809,240" fill="#9333ea" stroke="#d8b4fe" stroke-width="2"/>
    <polygon points="591,240 520,320 880,320 809,240" fill="#7c3aed" stroke="#c4b5fd" stroke-width="2"/>
    <polygon points="520,320 462,405 938,405 880,320" fill="#2563eb" stroke="#93c5fd" stroke-width="2"/>
    <polygon points="462,405 405,500 995,500 938,405" fill="#0891b2" stroke="#67e8f9" stroke-width="2"/>
    <polygon points="405,500 350,600 1050,600 995,500" fill="#059669" stroke="#6ee7b7" stroke-width="2"/>
    <polygon points="350,600 290,715 1110,715 1050,600" fill="#65a30d" stroke="#bef264" stroke-width="2"/>
    <polygon points="290,715 230,850 1170,850 1110,715" fill="#ca8a04" stroke="#fde68a" stroke-width="2"/>
    <polygon points="230,850 175,960 1225,960 1170,850" fill="#ea580c" stroke="#fed7aa" stroke-width="2"/>
  </g>

  <text x="700" y="187" text-anchor="middle" class="lvl">Nivel 7</text>
  <text x="700" y="216" text-anchor="middle" class="txt">Orquestación de agentes</text>

  <text x="700" y="270" text-anchor="middle" class="lvl">Nivel 6</text>
  <text x="700" y="300" text-anchor="middle" class="txt">Evals y validación sistemática</text>

  <text x="700" y="353" text-anchor="middle" class="lvl">Nivel 5</text>
  <text x="700" y="384" text-anchor="middle" class="txt">Loop engineering / Graph engineering</text>

  <text x="700" y="444" text-anchor="middle" class="lvl">Nivel 4</text>
  <text x="700" y="475" text-anchor="middle" class="txt">Second brain y conocimiento conectado</text>

  <text x="700" y="545" text-anchor="middle" class="lvl">Nivel 3</text>
  <text x="700" y="576" text-anchor="middle" class="txt">Harness propio del proyecto</text>

  <text x="700" y="655" text-anchor="middle" class="lvl">Nivel 2</text>
  <text x="700" y="688" text-anchor="middle" class="txt">Rules, MCPs, skills y assets</text>

  <text x="700" y="776" text-anchor="middle" class="lvl">Nivel 1</text>
  <text x="700" y="812" text-anchor="middle" class="txt">Plan mode y selección de modelos</text>

  <text x="700" y="892" text-anchor="middle" class="lvl">Nivel 0</text>
  <text x="700" y="927" text-anchor="middle" class="txt">Chat-driven coding</text>
  <text x="700" y="950" text-anchor="middle" class="small">Sin harness preparado</text>

  <path d="M1245 960 V405" class="arrow"/>
  <text x="1290" y="695" transform="rotate(-90 1290 695)" text-anchor="middle" class="side" fill="#fbbf24">Madurez del contexto</text>
  <path d="M1305 405 V150" class="arrow"/>
  <text x="1350" y="280" transform="rotate(-90 1350 280)" text-anchor="middle" class="side" fill="#67e8f9">Madurez de la ejecución</text>

  <g opacity="0.95">
    <rect x="85" y="860" width="265" height="92" rx="18" fill="#0f172a" stroke="#fb923c" stroke-width="2"/>
    <text x="110" y="897" class="note">Base: mucha validación</text>
    <text x="110" y="925" class="note">humana y poco contexto</text>
    <rect x="85" y="425" width="265" height="92" rx="18" fill="#0f172a" stroke="#facc15" stroke-width="2"/>
    <text x="110" y="462" class="note">Foco de la charla:</text>
    <text x="110" y="490" class="scope">niveles 3/4</text>
    <rect x="85" y="170" width="270" height="112" rx="18" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/>
    <text x="110" y="208" class="note">Horizonte avanzado:</text>
    <text x="110" y="236" class="note">confianza por evals,</text>
    <text x="110" y="264" class="note">trazas y coordinación</text>
  </g>
</svg>
