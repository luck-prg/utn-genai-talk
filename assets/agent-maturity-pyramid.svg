<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">Pirámide de madurez para desarrollar con agentes</title>
  <desc id="desc">Pirámide de siete niveles, desde chat-driven coding hasta orquestación de agentes, con madurez del contexto en la base y madurez de la ejecución en los niveles superiores.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#94a3b8"/>
    </marker>
    <style>
      .title{font:700 38px Inter,Arial,sans-serif;fill:#f8fafc}.subtitle{font:400 20px Inter,Arial,sans-serif;fill:#cbd5e1}.lvl{font:800 25px Inter,Arial,sans-serif;fill:#fff}.txt{font:600 22px Inter,Arial,sans-serif;fill:#f8fafc}.small{font:500 17px Inter,Arial,sans-serif;fill:#e2e8f0}.side{font:800 24px Inter,Arial,sans-serif;letter-spacing:.5px}.note{font:600 18px Inter,Arial,sans-serif;fill:#cbd5e1}.arrow{stroke:#94a3b8;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="980" fill="url(#bg)"/>
  <path d="M0 130 H1400 M0 260 H1400 M0 390 H1400 M0 520 H1400 M0 650 H1400 M0 780 H1400" stroke="#1e293b" stroke-width="1" opacity="0.45"/>
  <text x="700" y="70" text-anchor="middle" class="title">Niveles de profesionalismo para desarrollar con agentes</text>
  <text x="700" y="105" text-anchor="middle" class="subtitle">De usar un agente por chat a diseñar sistemas agentic confiables</text>

  <g filter="url(#shadow)">
    <polygon points="700,155 578,268 822,268" fill="#7c3aed" stroke="#c4b5fd" stroke-width="2"/>
    <polygon points="578,268 500,350 900,350 822,268" fill="#2563eb" stroke="#93c5fd" stroke-width="2"/>
    <polygon points="500,350 438,432 962,432 900,350" fill="#0891b2" stroke="#67e8f9" stroke-width="2"/>
    <polygon points="438,432 382,524 1018,524 962,432" fill="#059669" stroke="#6ee7b7" stroke-width="2"/>
    <polygon points="382,524 320,626 1080,626 1018,524" fill="#65a30d" stroke="#bef264" stroke-width="2"/>
    <polygon points="320,626 252,750 1148,750 1080,626" fill="#ca8a04" stroke="#fde68a" stroke-width="2"/>
    <polygon points="252,750 175,895 1225,895 1148,750" fill="#ea580c" stroke="#fed7aa" stroke-width="2"/>
  </g>

  <text x="700" y="215" text-anchor="middle" class="lvl">Nivel 6</text>
  <text x="700" y="245" text-anchor="middle" class="txt">Orquestación de agentes</text>
  <text x="700" y="305" text-anchor="middle" class="lvl">Nivel 5</text>
  <text x="700" y="334" text-anchor="middle" class="txt">Loop engineering / Graph engineering</text>
  <text x="700" y="388" text-anchor="middle" class="lvl">Nivel 4</text>
  <text x="700" y="417" text-anchor="middle" class="txt">Second brain y conocimiento conectado</text>
  <text x="700" y="475" text-anchor="middle" class="lvl">Nivel 3</text>
  <text x="700" y="506" text-anchor="middle" class="txt">Harness propio del proyecto</text>
  <text x="700" y="572" text-anchor="middle" class="lvl">Nivel 2</text>
  <text x="700" y="604" text-anchor="middle" class="txt">Rules, MCPs, skills y assets</text>
  <text x="700" y="683" text-anchor="middle" class="lvl">Nivel 1</text>
  <text x="700" y="717" text-anchor="middle" class="txt">Plan mode y selección de modelos</text>
  <text x="700" y="813" text-anchor="middle" class="lvl">Nivel 0</text>
  <text x="700" y="850" text-anchor="middle" class="txt">Chat-driven coding</text>
  <text x="700" y="876" text-anchor="middle" class="small">Sin harness preparado</text>

  <path d="M1245 895 V432" class="arrow"/>
  <text x="1290" y="690" transform="rotate(-90 1290 690)" text-anchor="middle" class="side" fill="#fbbf24">Madurez del contexto</text>
  <path d="M1305 432 V155" class="arrow"/>
  <text x="1350" y="300" transform="rotate(-90 1350 300)" text-anchor="middle" class="side" fill="#67e8f9">Madurez de la ejecución</text>

  <g opacity="0.95">
    <rect x="90" y="775" width="245" height="92" rx="18" fill="#0f172a" stroke="#fb923c" stroke-width="2"/>
    <text x="112" y="812" class="note">Base: mucha validación</text>
    <text x="112" y="840" class="note">humana y poco contexto</text>
    <rect x="90" y="190" width="250" height="110" rx="18" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/>
    <text x="112" y="228" class="note">Cima: mayor confianza</text>
    <text x="112" y="256" class="note">por validación, trazas</text>
    <text x="112" y="284" class="note">y coordinación</text>
  </g>
</svg>
