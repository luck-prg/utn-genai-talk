<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img" aria-labelledby="title desc">
  <title id="title">Capas de abstracción del desarrollo de software</title>
  <desc id="desc">Capas apiladas desde bits y hardware hasta las herramientas para construir software, donde primero aparecieron los IDE y ahora los ADE, entornos de desarrollo agénticos.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title{font:700 38px Inter,Arial,sans-serif;fill:#f8fafc}
      .subtitle{font:400 20px Inter,Arial,sans-serif;fill:#cbd5e1}
      .layer{font:700 25px Inter,Arial,sans-serif;fill:#f8fafc}
      .egs{font:500 18px Inter,Arial,sans-serif;fill:#cbd5e1}
      .group{font:800 22px Inter,Arial,sans-serif;fill:#5eead4;letter-spacing:.5px}
      .tool{font:800 27px Inter,Arial,sans-serif;fill:#ffffff}
      .io{font:700 19px Inter,Arial,sans-serif;fill:#f0fdfa}
      .toolegs{font:500 17px Inter,Arial,sans-serif;fill:#ccfbf1}
      .badge{font:800 15px Inter,Arial,sans-serif;letter-spacing:1px}
      .side{font:700 19px Inter,Arial,sans-serif;fill:#94a3b8;letter-spacing:.5px}
    </style>
  </defs>

  <rect width="1400" height="920" fill="url(#bg)"/>

  <text x="700" y="58" text-anchor="middle" class="title">Las capas de abstracción del desarrollo</text>
  <text x="700" y="92" text-anchor="middle" class="subtitle">Cada capa nos aleja de la máquina y nos acerca a la intención</text>

  <!-- Capa superior: herramientas para construir software -->
  <g filter="url(#shadow)">
    <rect x="190" y="128" width="1020" height="318" rx="22" fill="#082f2c" stroke="#18b3a3" stroke-width="3"/>
  </g>
  <text x="230" y="168" class="group">HERRAMIENTAS PARA CONSTRUIR SOFTWARE</text>

  <!-- ADE (actual, arriba) -->
  <rect x="222" y="188" width="956" height="112" rx="16" fill="#18b3a3" stroke="#99f6e4" stroke-width="2"/>
  <rect x="1020" y="202" width="60" height="26" rx="13" fill="#042f2e"/>
  <text x="1050" y="220" text-anchor="middle" class="badge" fill="#5eead4">HOY</text>
  <text x="252" y="228" class="tool">ADE · Agentic Development Environment</text>
  <text x="252" y="258" class="io">Input: CONTEXTO  →  Output: CÓDIGO</text>
  <text x="252" y="285" class="toolegs">Claude Code · Codex · OpenCode · Gemini CLI</text>

  <!-- IDE (previo, abajo) -->
  <rect x="222" y="314" width="956" height="112" rx="16" fill="#0f766e" stroke="#5eead4" stroke-width="2"/>
  <rect x="1000" y="328" width="80" height="26" rx="13" fill="#042f2e"/>
  <text x="1040" y="346" text-anchor="middle" class="badge" fill="#5eead4">ANTES</text>
  <text x="252" y="354" class="tool">IDE · Integrated Development Environment</text>
  <text x="252" y="384" class="io">Input: CÓDIGO  →  Output: CÓDIGO</text>
  <text x="252" y="411" class="toolegs">VS Code · IntelliJ · Eclipse · Vim</text>

  <!-- Capas base -->
  <g filter="url(#shadow)">
    <rect x="190" y="468" width="1020" height="72" rx="16" fill="#7b13cc" stroke="#d8b4fe" stroke-width="2"/>
    <rect x="190" y="552" width="1020" height="72" rx="16" fill="#6d28d9" stroke="#c4b5fd" stroke-width="2"/>
    <rect x="190" y="636" width="1020" height="72" rx="16" fill="#4c1d95" stroke="#a78bfa" stroke-width="2"/>
    <rect x="190" y="720" width="1020" height="72" rx="16" fill="#334155" stroke="#64748b" stroke-width="2"/>
    <rect x="190" y="804" width="1020" height="72" rx="16" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  </g>

  <text x="230" y="512" class="layer">Frameworks, APIs y plataformas</text>
  <text x="1170" y="511" text-anchor="end" class="egs">Spring · React · AWS</text>

  <text x="230" y="596" class="layer">Lenguajes de alto nivel</text>
  <text x="1170" y="595" text-anchor="end" class="egs">Java · Python · JavaScript</text>

  <text x="230" y="680" class="layer">Lenguajes de bajo nivel</text>
  <text x="1170" y="679" text-anchor="end" class="egs">C · C++</text>

  <text x="230" y="764" class="layer">Assembler</text>
  <text x="1170" y="763" text-anchor="end" class="egs">MOV · ADD · JMP</text>

  <text x="230" y="848" class="layer">Bits / hardware</text>
  <text x="1170" y="847" text-anchor="end" class="egs">instrucciones de máquina</text>

  <!-- Ejes laterales, sin flechas -->
  <text x="118" y="250" transform="rotate(-90 118 250)" text-anchor="middle" class="side" fill="#5eead4">MÁS CERCA DE LA INTENCIÓN</text>
  <text x="118" y="700" transform="rotate(-90 118 700)" text-anchor="middle" class="side">MÁS CERCA DE LA MÁQUINA</text>
</svg>
